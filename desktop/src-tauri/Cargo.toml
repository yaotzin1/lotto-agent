[package]
name = "lotto-agent-desktop"
version = "1.0.3"
description = "Tauri v2 desktop wrapper for Lotto Agent (Symfony 8.2 / PHP 8.5 sidecar)"
authors = ["yaotzin1"]
edition = "2021"

[lib]
name = "lotto_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
