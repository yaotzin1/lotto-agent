services:
  # Główny serwis naszego agenta
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      # Nazwany wolumen zamiast anonimowego: historia losowań w var/draw-history
      # MUSI przetrwać `docker compose run --rm`, inaczej każde uruchomienie
      # pobierałoby ją od zera i natychmiast trafiało na HTTP 429.
      - lotto_var:/app/var
    env_file:
      - .env.dev
    tty: true
    working_dir: /app

volumes:
  lotto_var:
