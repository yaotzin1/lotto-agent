# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(GEMINI_API_KEY): ''
    gemini_api_key: '%env(GEMINI_API_KEY)%'
    env(LOTTO_API_KEY): ''
    lotto_api_key: '%env(LOTTO_API_KEY)%'
    env(AI_PROVIDER): 'gemini'
    ai_provider: '%env(AI_PROVIDER)%'
    env(AI_MODEL): ''
    ai_model: '%env(AI_MODEL)%'
    env(ANTHROPIC_API_KEY): ''
    anthropic_api_key: '%env(ANTHROPIC_API_KEY)%'
    env(OPENAI_API_KEY): ''
    openai_api_key: '%env(OPENAI_API_KEY)%'
    env(DEEPSEEK_API_KEY): ''
    deepseek_api_key: '%env(DEEPSEEK_API_KEY)%'
    env(OPENAI_BASE_URL): ''
    openai_base_url: '%env(OPENAI_BASE_URL)%'
    env(LOTTO_DESKTOP_TOKEN): ''
    lotto_desktop_token: '%env(LOTTO_DESKTOP_TOKEN)%'
    env(LOTTO_APP_DATA_DIR): ''
    lotto_app_data_dir: '%env(LOTTO_APP_DATA_DIR)%'
    env(LOTTO_ENV_FILE): ''
    lotto_env_file: '%env(LOTTO_ENV_FILE)%'
    env(LOTTO_STORAGE_DIR): '%kernel.project_dir%/var/draw-history'
    env(LOTTO_DATA_DIR): '%kernel.project_dir%/data'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Service\AgentTools\LottoToolInterface:
            tags: ['app.lotto_agent_tool']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\DrawHistoryProvider:
        arguments:
            $storageDir: '%env(resolve:LOTTO_STORAGE_DIR)%'

    App\Service\DrawArchiveService:
        arguments:
            $dataDir: '%env(resolve:LOTTO_DATA_DIR)%'

    App\Service\Llm\LlmClientInterface: '@App\Service\GeminiApiClient'




    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
